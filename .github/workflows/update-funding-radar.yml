name: Update Funding Radar

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  funding-radar:
    uses: ./.github/workflows/radar-reusable.yml
    with:
      radar_name: funding-radar
      radar_path: funding-radar
      run_update: true
      validate_cmd: |
        python -m json.tool funding-radar/calls.json > /dev/null
        python -m json.tool funding-radar/news.json > /dev/null
    secrets: inherit
