name: Update Funding Radar

on:
  workflow_dispatch:

jobs:
  funding-radar:
    uses: ./.github/workflows/radar-reusable.yml
    with:
      radar_name: funding-radar
      radar_path: funding-radar
      run_update: false
      validate_cmd: |
        python -m py_compile funding-radar/sync_calls_from_md.py funding-radar/fix_calls_links.py funding-radar/verify_calls_links.py
        python -m json.tool funding-radar/calls.json > /dev/null
        python -m json.tool funding-radar/news.json > /dev/null
        python -m json.tool funding-radar/link_fix_report.json > /dev/null
        python -m json.tool funding-radar/link_verification_report.json > /dev/null
    secrets: inherit
