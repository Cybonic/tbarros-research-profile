name: Update Professor Radar

on:
  workflow_dispatch:

jobs:
  professor-radar:
    uses: ./.github/workflows/radar-reusable.yml
    with:
      radar_name: professor-radar
      radar_path: professor-radar
      run_update: false
      validate_cmd: |
        python professor-radar/update_professor_radar.py --self-test
        python -m py_compile professor-radar/update_professor_radar.py
        python -m json.tool professor-radar/sources.json > /dev/null
        python -m json.tool professor-radar/results.json > /dev/null
        python -m json.tool professor-radar/scan_state.json > /dev/null
    secrets: inherit
