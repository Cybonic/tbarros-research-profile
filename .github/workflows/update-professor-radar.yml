name: Update Professor Radar

on:
  schedule:
    - cron: "15 9 * * 1"
  workflow_dispatch:

jobs:
  professor-radar:
    uses: ./.github/workflows/radar-reusable.yml
    with:
      radar_name: professor-radar
      radar_path: professor-radar
      run_update: false
      validate_cmd: |
        python -m json.tool professor-radar/results.json > /dev/null
    secrets: inherit
